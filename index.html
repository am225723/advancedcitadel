<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		
		<!-- Favicon and App Icons -->
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/icon-512.png" />
		
		<!-- PWA Manifest -->
		<link rel="manifest" href="/manifest.json" />
		
		<!-- Mobile Web App Meta Tags -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="The Citadel" />
		<meta name="application-name" content="The Citadel" />
		
		<!-- Theme Colors -->
		<meta name="theme-color" content="#0f172a" />
		<meta name="msapplication-TileColor" content="#0f172a" />
		<meta name="msapplication-TileImage" content="/icon-512.png" />
		
		<!-- App Description -->
		<meta name="description" content="The Citadel - A therapeutic mental health app featuring a gamified garage experience, AI-powered journaling, guided meditations, and cognitive reframing tools." />
		<meta name="keywords" content="mental health, therapy, meditation, journaling, mindfulness, wellness, CBT, self-care" />
		
		<!-- Open Graph -->
		<meta property="og:title" content="The Citadel - Your Mental Fortress" />
		<meta property="og:description" content="A therapeutic mental health app featuring a gamified garage experience and Dark Souls-inspired guide personas." />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="/icon-512.png" />
		
		<meta name="generator" content="Hostinger Horizons" />
		<title>The Citadel - Your Mental Fortress</title>
		
		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
		
		<!-- iOS Splash Screens -->
		<link rel="apple-touch-startup-image" href="/icon-512.png" />
		
		<!-- Prevent phone number detection -->
		<meta name="format-detection" content="telephone=no" />
		
		<style>
			/* Prevent overscroll bounce */
			html, body {
				overscroll-behavior: none;
				-webkit-overflow-scrolling: touch;
			}
			
			/* Safe area padding for notched devices */
			body {
				padding-top: env(safe-area-inset-top);
				padding-bottom: env(safe-area-inset-bottom);
				padding-left: env(safe-area-inset-left);
				padding-right: env(safe-area-inset-right);
			}
			
			/* Prevent text selection during touch */
			* {
				-webkit-tap-highlight-color: transparent;
			}
			
			/* PWA loading state */
			#root:empty {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
			}
			
			#root:empty::after {
				content: '';
				width: 48px;
				height: 48px;
				border: 4px solid rgba(234, 179, 8, 0.3);
				border-top-color: #eab308;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}
			
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
		
		<!-- Service Worker Registration -->
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js')
						.then((registration) => {
							console.log('ServiceWorker registered:', registration.scope);
						})
						.catch((error) => {
							console.log('ServiceWorker registration failed:', error);
						});
				});
			}
		</script>
	</body>
</html>
